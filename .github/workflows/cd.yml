name: CD

# Runs only after CI succeeds on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Push images to GHCR
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}-backend:latest
            ghcr.io/${{ env.REPO }}-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          push: true
          # VITE_API_URL is baked in at build time. Set it as a repo *variable* (not secret).
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ env.REPO }}-frontend:latest
            ghcr.io/${{ env.REPO }}-frontend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend

  deploy-render:
    name: Deploy to Render
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in repo settings if you want manual approval
    steps:
      # Each hook URL comes from Render > Service > Settings > Deploy Hook.
      # Skipped silently if a secret isn't set (e.g. no separate worker service).
      - name: Backend
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: '[ -z "$HOOK" ] || curl -fsS -X POST "$HOOK"'
      - name: Worker
        env:
          HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
        run: '[ -z "$HOOK" ] || curl -fsS -X POST "$HOOK"'
      - name: Frontend
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: '[ -z "$HOOK" ] || curl -fsS -X POST "$HOOK"'
